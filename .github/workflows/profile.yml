name: Refresh profile

# Regenerates everything dynamic on the profile README:
#   - assets/stats.svg, assets/languages.svg  (scripts/generate_stats.py)
#   - assets/github-snake*.svg                (Platane/snk)
#   - "Latest writing" list in README.md      (scripts/update_blog.py)

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

env:
  LOGIN: rosswickman
  BLOG_URL: https://rosswickman.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py "$LOGIN"

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true # keep stats/blog updates if the snake fails
        with:
          github_user_name: ${{ env.LOGIN }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF9900
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF9900

      - name: Latest blog posts
        run: python scripts/update_blog.py "$BLOG_URL" --count 5

      - name: Commit changes
        run: |
          if compgen -G 'dist/*.svg' >/dev/null; then cp dist/*.svg assets/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
