<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="GitHub Stats">
  <title>GitHub Stats</title>
  <style>
    .title { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #FF9900; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .value { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c9d1d9; }
    .row { opacity: 0; animation: fade .4s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="199" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" class="title">GitHub Stats</text>
  <g class="row" style="animation-delay:0ms"><text x="24" y="64" class="label">Stars earned</text><text x="396" y="64" class="value" text-anchor="end">15</text></g>
  <g class="row" style="animation-delay:120ms"><text x="24" y="86" class="label">Contributions (last year)</text><text x="396" y="86" class="value" text-anchor="end">989</text></g>
  <g class="row" style="animation-delay:240ms"><text x="24" y="108" class="label">Pull requests</text><text x="396" y="108" class="value" text-anchor="end">28</text></g>
  <g class="row" style="animation-delay:360ms"><text x="24" y="130" class="label">Issues</text><text x="396" y="130" class="value" text-anchor="end">6</text></g>
  <g class="row" style="animation-delay:480ms"><text x="24" y="152" class="label">Public repos</text><text x="396" y="152" class="value" text-anchor="end">15</text></g>
  <g class="row" style="animation-delay:600ms"><text x="24" y="174" class="label">Contributed to</text><text x="396" y="174" class="value" text-anchor="end">0</text></g>
</svg>
